<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會計學習追蹤系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold mb-4 text-center">4週會計學習計畫</h1>
        <div id="tasks" class="space-y-3">
            <!-- Day 1 -->
            <div class="flex items-center space-x-3">
                <input type="checkbox" id="d1" class="w-5 h-5">
                <label for="d1">Day 1: 複習借貸法則 (Dr/Cr) 與中英術語對照</label>
            </div>
            <!-- 可以繼續增加 Day 2-28 -->
        </div>
        <p class="mt-6 text-sm text-gray-500 italic">提示：下週一開始執行，加油！</p>
    </div>
    <script>
        // 自動載入勾選狀態
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach(cb => {
            cb.checked = localStorage.getItem(cb.id) === 'true';
            cb.addEventListener('change', () => {
                localStorage.setItem(cb.id, cb.checked);
            });
        });
    </script>
</body>
</html>
